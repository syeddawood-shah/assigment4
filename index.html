
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seminar Schedule</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Times New Roman', serif;
}

body {
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
}

table {
    border-collapse: collapse;
    border: 2px solid black;
    background: #fff;
    text-align: center;
    width: 80%;
    max-width: 400px;
    font-size: 15px;
}

th, td {
    border: 2px solid black;
    padding: 10px 15px;
}

thead th {
    font-weight: bold;
    font-size: 17px;
}

/* Colors jese image me hain */
.yellow {
    background: #ffff99;
}
.blue {
    background: #ccccff;
}
.green {
    background: #ccffcc;
}

/* Hover effect */
tbody tr:hover {
    background: #f9f9f9;
}
</style>
</head>
<body>

<table>
    <thead>
        <tr>
            <th rowspan="3">Day</th>
            <th colspan="3">Seminar</th>
        </tr>
        <tr>
            <th colspan="2">Schedule</th>
            <th rowspan="2">Topic</th>
        </tr>
        <tr>
            <th>Begin</th>
            <th>End</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td rowspan="2">Monday</td>
            <td class="yellow">8:00 a.m.</td>
            <td class="blue">5:00 p.m.</td>
            <td>Introduction to XML</td>
        </tr>
        <tr>
            <td colspan="2"></td>
            <td>Validity: DTD and Relax NG</td>
        </tr>
        <tr>
            <td rowspan="3">Tuesday</td>
            <td class="yellow">8:00 a.m.</td>
            <td class="yellow">11:00 a.m.</td>
            <td rowspan="2">XPath</td>
        </tr>
        <tr>
            <td class="yellow">11:00 a.m.</td>
            <td class="green">2:00 p.m.</td>
        </tr>
        <tr>
            <td class="green">2:00 p.m.</td>
            <td class="blue">5:00 p.m.</td>
            <td>XSL Transformations</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td class="yellow">8:00 a.m.</td>
            <td class="green">12:00 p.m.</td>
            <td>XSL Formatting Objects</td>
        </tr>
    </tbody>
</table>

</body>
</html>
